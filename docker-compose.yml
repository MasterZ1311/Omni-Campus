version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: omnicampus-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: omnicampus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omnicampus-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnicampus-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/omnicampus?schema=public
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=production-secret-session-key-change-it
      - JWT_SECRET=production-secret-jwt-key-change-it
      - JWT_EXPIRES_IN=8h
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
      - redis
    command: sh -c "npx prisma db push && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnicampus-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
